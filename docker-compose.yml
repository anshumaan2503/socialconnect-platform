services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialconnect-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: socialconnect-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
